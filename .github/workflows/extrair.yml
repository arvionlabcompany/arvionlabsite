name: Extrair zip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o ArvionlabNOVOSITE.zip -x ".github/*"
          rm ArvionlabNOVOSITE.zip
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Extrair site"
          git push
